<script>
'use strict';
/* =========================================================
   흑월 저택 - 할로윈의 밤
   2D 탑뷰 공포 탐색 게임 (참고: 아오오니, 이브)
   조작: 방향키/WASD 이동, Shift 달리기, Space/Enter/Z 조사·대화 넘기기
   ========================================================= */

const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const MAIN = ctx;
const W = 640, H = 480, T = 32, COLS = 20, ROWS = 15, SC = 2;
cv.width = W * SC; cv.height = H * SC;
const FONT = '"Gowun Batang","Malgun Gothic","Apple SD Gothic Neo",serif';
const NFONT = '"Nanum Pen Script","Gowun Batang","Malgun Gothic",cursive';

// ---------- 도구 ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function pp(w, a, b) { const c = w.charCodeAt(w.length - 1); if (c < 0xAC00 || c > 0xD7A3) return a; return ((c - 0xAC00) % 28) ? a : b; }
function hx(c) { if (c[0] === 'r') return c.match(/[\d.]+/g).slice(0, 3).map(Number); c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(s => s + s).join(''); return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)]; }
function sh(c, a) { const [r, g, b] = hx(c); const f = v => Math.round(clamp(a >= 0 ? v + (255 - v) * a : v * (1 + a), 0, 255)); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function C(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.abs(r), 0, Math.PI * 2); ctx.fill(); }
function E(x, y, rx, ry, c, rot) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); ctx.fill(); }
function P(pts, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function L(x1, y1, x2, y2, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w || 1; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function limb(x1, y1, x2, y2, w, c) { ctx.lineCap = 'round'; L(x1, y1, x2, y2, c, w); ctx.lineCap = 'butt'; }
function vg(y, h, c1, c2) { const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, c1); g.addColorStop(1, c2); return g; }
function hg(x, w, c1, c2) { const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, c1); g.addColorStop(1, c2); return g; }
function rg(x, y, r, c1, c2, x0, y0) { const g = ctx.createRadialGradient(x0 != null ? x0 : x, y0 != null ? y0 : y, 0, x, y, r); g.addColorStop(0, c1); g.addColorStop(1, c2); return g; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function box(x, y, w, h, c) { // 위가 밝고 아래가 어두운 입체 상자
  ctx.fillStyle = vg(y, h, sh(c, 0.12), sh(c, -0.3)); ctx.fillRect(x, y, w, h);
  R(x, y, w, 0.8, sh(c, 0.32)); R(x, y + h - 0.8, w, 0.8, sh(c, -0.55)); R(x, y, 0.7, h, sh(c, 0.1)); R(x + w - 0.7, y, 0.7, h, sh(c, -0.45));
}
function grain(x, y, w, h, a) { ctx.strokeStyle = `rgba(0,0,0,${a || 0.12})`; ctx.lineWidth = 0.4; for (let gy = y + 1.5; gy < y + h; gy += 2.2) { ctx.beginPath(); for (let gx = x; gx <= x + w; gx += 3) { const yy = gy + Math.sin((gx + gy * 7) / 7) * 0.4; gx === x ? ctx.moveTo(gx, yy) : ctx.lineTo(gx, yy); } ctx.stroke(); } }
function softShadow(x, y, rx, ry, a) { ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); ctx.fillStyle = rg(0, 0, rx, `rgba(0,0,0,${a || 0.5})`, 'rgba(0,0,0,0)'); ctx.fillRect(-rx, -rx, rx * 2, rx * 2); ctx.restore(); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
const WOOD = '#5a3a22', DWOOD = '#3a2414', GOLD = '#b08a3a', SKIN = '#f0cfae';

// =========================================================
// 설정 (갑툭튀 세기) - 이 브라우저에만 저장
// =========================================================
let MILD = false;
try { MILD = localStorage.getItem('hm_mild') === '1'; } catch (e) { }
function saveMild() { try { localStorage.setItem('hm_mild', MILD ? '1' : '0'); } catch (e) { } }

// =========================================================
// 소리 (Web Audio 로 직접 합성)
// =========================================================
let AC = null, MG = null, NB = null, AMBG = null;
function duck(on) { if (!AMBG) return; AMBG.gain.setTargetAtTime(on ? 0.0001 : 0.05, AC.currentTime, on ? 0.08 : 0.6); }
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  MG = AC.createGain(); MG.gain.value = 0.7; MG.connect(AC.destination);
  NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const o1 = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o1.type = o2.type = 'sawtooth'; o1.frequency.value = 55; o2.frequency.value = 55.7;
  f.type = 'lowpass'; f.frequency.value = 170; g.gain.value = 0.05;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(MG); o1.start(); o2.start(); AMBG = g;
}
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function tone(f, dur, type, vol, delay, f2) {
  if (!AC) return; const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, 0.01, vol || 0.2, dur); o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, freq, ftype, delay, q) {
  if (!AC) return; const t = AC.currentTime + (delay || 0);
  const s = AC.createBufferSource(); s.buffer = NB; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = ftype || 'lowpass'; f.frequency.value = freq || 1000; if (q) f.Q.value = q;
  const g = AC.createGain(); env(g, t, 0.005, vol || 0.2, dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const SFX = {
  step() { noise(0.05, 0.035, 500 + Math.random() * 300); },
  runStep() { noise(0.07, 0.07, 320 + Math.random() * 200); tone(70, 0.06, 'sine', 0.06); },
  knock() { for (let i = 0; i < 3; i++) { noise(0.1, 0.35, 220, 'lowpass', i * 0.55); tone(90, 0.12, 'sine', 0.3, i * 0.55, 60); } },
  creak() { tone(220, 1.6, 'sawtooth', 0.03, 0, 140); tone(233, 1.6, 'sawtooth', 0.02, 0.2, 150); },
  scare() { // 갑툭튀: 낮은 쿵 + 금속성 비명 + 노이즈
    const v = MILD ? 0.2 : 1;
    tone(75, 1.0, 'sine', 0.9 * v, 0, 26); tone(150, 0.5, 'square', 0.22 * v, 0, 45);
    [1760, 1865, 2217, 2349].forEach(f => tone(f, 0.7, 'sawtooth', 0.045 * v, 0, f * 0.45));
    noise(0.3, 0.9 * v, 3500, 'highpass'); noise(0.9, 0.5 * v, 900, 'bandpass', 0.05, 1.5);
    SFX.scream(1.2);
  },
  pick() { tone(784, 0.15, 'triangle', 0.15); tone(1175, 0.3, 'triangle', 0.12, 0.1); },
  paper() { noise(0.25, 0.08, 3000, 'highpass'); },
  door() { tone(150, 0.45, 'sawtooth', 0.04, 0, 90); noise(0.25, 0.08, 400); },
  locked() { tone(160, 0.08, 'square', 0.07); tone(120, 0.12, 'square', 0.07, 0.1); },
  unlock() { tone(600, 0.05, 'square', 0.07); tone(900, 0.08, 'square', 0.07, 0.08); },
  tick() { tone(1200, 0.03, 'square', 0.04); },
  slam() { noise(0.6, MILD ? 0.4 : 0.9, 250); tone(55, 0.6, 'sine', MILD ? 0.3 : 0.7, 0, 35); },
  sting() { [233, 247, 349, 370].forEach(f => tone(f, 1.4, 'sawtooth', MILD ? 0.025 : 0.05)); noise(0.8, MILD ? 0.08 : 0.2, 1500, 'bandpass'); },
  heart() { tone(62, 0.15, 'sine', 0.35, 0, 40); tone(56, 0.18, 'sine', 0.28, 0.18, 35); },
  thunder() { noise(1.8, MILD ? 0.25 : 0.55, 200); noise(0.4, MILD ? 0.15 : 0.35, 1200); },
  match() { noise(0.3, 0.2, 2500, 'highpass'); tone(200, 0.4, 'sine', 0.05); },
  chime() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 1.4, 'sine', 0.07, i * 0.18)); },
  music() { [392, 392, 440, 392, 523, 494, 392, 392, 440, 392, 587, 523].forEach((f, i) => tone(f * (1 - Math.random() * 0.035), 0.55, 'triangle', 0.08, i * 0.36)); },
  scream(v) {
    if (!AC) return; v = (v == null ? 1 : v) * (MILD ? 0.25 : 1); const t = AC.currentTime;
    for (let i = 0; i < 4; i++) {
      const o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
      o.type = 'sawtooth'; const b = 500 + i * 130;
      o.frequency.setValueAtTime(b, t); o.frequency.exponentialRampToValueAtTime(b * 2.2, t + 0.12); o.frequency.exponentialRampToValueAtTime(b * 0.6, t + 1.3);
      l.frequency.value = 25 + i * 7; lg.gain.value = 60; l.connect(lg); lg.connect(o.frequency);
      env(g, t, 0.02, 0.12 * v, 1.4); o.connect(g); g.connect(MG); o.start(t); l.start(t); o.stop(t + 1.5); l.stop(t + 1.5);
    }
    noise(1.2, 0.5 * v, 1800, 'bandpass', 0, 0.7); noise(0.5, 0.6 * v, 300);
  },
  ambient() {
    const k = (Math.random() * 3) | 0;
    if (k === 0) tone(90 + Math.random() * 40, 0.8, 'sawtooth', 0.025, 0, 60);
    else if (k === 1) { for (let i = 0; i < 3; i++) noise(0.12, 0.12, 180, 'lowpass', i * 0.35); }
    else noise(1.5, 0.04, 900 + Math.random() * 600, 'bandpass', 0, 4);
  }
};

// =========================================================
// 입력 (한글 입력 상태에서도 되도록 e.code 사용)
// =========================================================
const keys = {}, pressed = new Set();
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed.add(e.code);
  keys[e.code] = true; initAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const isDown = (...ks) => ks.some(k => keys[k]);
const hit = (...ks) => ks.some(k => pressed.has(k));
const OKK = ['Enter', 'Space', 'KeyZ', 'NumpadEnter'];

function objective() {

  if (!F.open_stairs) return '2층 열쇠로 홀 북쪽 계단의 철창문을 열자.';
  if (!F.hook || !F.matches) {
    const a = []; if (!F.hook) a.push('갤러리(서쪽)'); if (!F.matches) a.push('아이 방(동쪽)');
    return '2층을 조사하자: ' + a.join(', ');
  }

  if (S.map === 'attic') return '호박등에 불을 붙이자.';

}

function norm(l) { if (typeof l === 'string') return { text: l }; if (Array.isArray(l)) return { who: l[0], text: l[1] }; return l; }
function say(...lines) { return new Promise(res => { dialog = { lines: lines.map(norm), i: 0, c: 0, res }; }); }
function choose(q, opts) { return new Promise(res => { choice = { q, opts, i: 0, res }; }); }
function numLock() { return new Promise(res => { lock = { d: [0, 0, 0, 0], i: 0, res }; }); }
function toast(text, sec) { toastMsg = { text, t: sec || 3.5 }; }
function tweenFade(to, ms) { return new Promise(res => { fadeT = { from: fade, to, ms, t: 0, res }; }); }
async function jumpscare(type) {
  SFX.scare(); shakeT = MILD ? 0.25 : 1.0; lastScare = type;
  await new Promise(res => { scare = { type, ghost: pickGhost(type), t: 0, dur: MILD ? 0.9 : 1.35, inv: false, res }; });
  duck(false); afterT = MILD ? 0 : 1;

}
function flash() { lightT = 0.35; return new Promise(res => { flashFx = { t: 0, dur: 0.75, res }; }); }
function moveActor(a, x, y, sp) { return new Promise(res => { a.tx = x; a.ty = y; a.sp = sp; a.res = res; }); }
function fadeActor(a, to, ms) { return new Promise(res => { a.fa = { from: a.alpha, to, ms, t: 0, res }; }); }

async function run(fn) { scriptDepth++; try { await fn(); } catch (e) { console.error(e); } finally { scriptDepth = Math.max(0, scriptDepth - 1); } }

function saveCP() { const h = S.hidden; S.hidden = null; CP = JSON.stringify(S); S.hidden = h; }
function loadCP() {
  S = JSON.parse(CP); F = S.flags; S.hidden = null;
  M = { active: false }; actors = []; dialog = choice = lock = null; scare = flashFx = null; fadeT = null;
  scriptDepth = 0; fade = 0; doorCD = 0; mode = 'play'; modeT = 0; afterT = 0; duck(false);
  bg = renderBG(S.map);

}

// 쫓아오는 것 (잭)

function startChase(o) {
  M = {
    active: true, x: (o.tx + 0.5) * T, y: (o.ty + 0.5) * T + 6, delay: o.delay != null ? o.delay : 1.2,
    path: [], repath: 0, lost: 0, walk: 0, pending: null,
    chase: { t: o.dur || 15, final: !!o.final, speed: o.speed || (o.final ? 127 : 115) }, // 115 = 하루가 걷는 속도
  };
  SFX.sting(); heartT = 0;
}
function endChase(msg) { M = { active: false }; if (msg) toast(msg, 4); saveCP(); }
function caught() {
  M = { active: false };
  run(async () => { await jumpscare('jack'); mode = 'dead'; modeT = 0; });
}
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function passGrid() {
  const m = MAPS[S.map], g = new Array(COLS * ROWS);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) g[y * COLS + x] = m.grid[y][x] !== '#';
  for (const o of m.objs) if (o.solid && vis(o)) for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) g[y * COLS + x] = false;
  return g;
}
function bfs(g, sx, sy, tx, ty) {
  const s = sy * COLS + sx, tg = ty * COLS + tx; if (s === tg) return [];
  const prev = new Int16Array(COLS * ROWS).fill(-1); prev[s] = s; const q = [s]; let h = 0;
  while (h < q.length) {
    const c = q[h++]; if (c === tg) break; const cx = c % COLS, cy = (c / COLS) | 0;
    for (const [dx, dy] of D4) {
      const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      const n = ny * COLS + nx; if (prev[n] !== -1 || !g[n]) continue; prev[n] = c; q.push(n);
    }
  }
  if (prev[tg] === -1) return null;
  const path = []; let c = tg; while (c !== s) { path.push(c); c = prev[c]; } return path.reverse();
}
function updMonster(dt) {
  if (!M.chase) return;
  if (M.pending && M.pending.map === S.map) {
    M.pending.t -= dt;
    if (M.pending.t <= 0) { M.x = M.pending.x; M.y = M.pending.y; M.active = true; M.pending = null; M.delay = 0.3; M.path = []; M.repath = 0; SFX.sting(); }
  }
  if (!M.chase.final) { M.chase.t -= dt; if (M.chase.t <= 0) { endChase('…발소리가 멀어졌다. 잭이 사라진 것 같다.'); return; } }
  if (!M.active) return;
  if (M.delay > 0) { M.delay -= dt; return; }
  let tx = S.x, ty = S.y;
  if (S.hidden) {
    const o = S.hidden;
    if (M.grab != null) { // 숨는 걸 봤다: 곧장 와서 끄집어낸다
      tx = (o.x + o.w / 2) * T; ty = (o.y + o.h) * T + 22; M.grab -= dt;
      if (M.grab < 0.9 && !M.rattled) { M.rattled = 1; SFX.door(); shakeT = 0.5; } // 문이 덜컹
      if (M.grab <= 0) { S.hidden = null; SFX.door(); caught(); return; }
    } else {
      M.lost += dt;
      tx = (o.x + o.w / 2) * T + Math.sin(M.lost * 2) * 40; ty = (o.y + o.h) * T + 22;
      if (M.lost > 2.6) { endChase('…잭은 아무것도 찾지 못하고 사라졌다.'); return; }
    }
  } else M.lost = 0;
  M.repath -= dt;
  if (M.repath <= 0) {
    M.repath = 0.25; const g = passGrid();
    const sx = clamp((M.x / T) | 0, 0, COLS - 1), sy = clamp((M.y / T) | 0, 0, ROWS - 1);
    const gx = clamp((tx / T) | 0, 0, COLS - 1), gy = clamp((ty / T) | 0, 0, ROWS - 1);
    g[gy * COLS + gx] = true; M.path = bfs(g, sx, sy, gx, gy) || [];
  }
  let mx, my; const dist = Math.hypot(tx - M.x, ty - M.y);
  if (M.path.length === 0 || dist < T * 1.2) { mx = tx; my = ty; }
  else {
    const c = M.path[0]; mx = (c % COLS + 0.5) * T; my = (((c / COLS) | 0) + 0.5) * T + 6;
    if (Math.hypot(mx - M.x, my - M.y) < 3 && M.path.length > 1) { M.path.shift(); const n = M.path[0]; mx = (n % COLS + 0.5) * T; my = (((n / COLS) | 0) + 0.5) * T + 6; }
  }
  const d = Math.hypot(mx - M.x, my - M.y);
  if (d > 0.5) { const s = Math.min(d, M.chase.speed * dt); M.x += (mx - M.x) / d * s; M.y += (my - M.y) / d * s; M.walk += dt; }
  if (!S.hidden && Math.hypot(S.x - M.x, S.y - M.y) < 20) caught();
}

function placeMap(id, tx, ty) { PUFFS.length = 0; S.map = id; S.x = (tx + 0.5) * T; S.y = (ty + 0.5) * T + 6; bg = renderBG(id); }
async function goTo(id, tx, ty) {

  if (chasing) { M.active = false; M.pending = { map: id, x: S.x, y: S.y, t: M.chase.final ? 1.8 : 2.3 }; }
  else saveCP();

}
async function touchDoor(d) {
  if (d.front) {

      F.eyeScare = 1;

      await say(['하루', '허억…!!'], '문에 손을 대는 순간, 우편함 틈 너머에서 핏발 선 눈이 이쪽을 들여다보고 있었다.', '…다시 보니 틈은 새까맣기만 하다.'); SFX.knock();

  if (d.custom) { const ok = await d.custom(); if (!ok) { doorCD = 1; return; } }
  if (d.item && !F['open_' + d.id]) {
    if (has(d.item)) {

}
function moveP(mx, my) {
  if (!mx && !my) return;
  const nx = S.x + mx, ny = S.y + my, l = nx - 9, r = nx + 9, t = ny - 10, b = ny + 3, m = MAPS[S.map];
  let wall = false, door = null;
  for (let ty = Math.floor(t / T); ty <= Math.floor(b / T); ty++) for (let tx = Math.floor(l / T); tx <= Math.floor(r / T); tx++) {
    const ch = (m.grid[ty] || '')[tx];
    if (ch === undefined || ch === '#') wall = true;
    else if (ch === 'D') { if (m.doors[tx + ',' + ty]) door = m.doors[tx + ',' + ty]; else wall = true; }
  }
  if (door) { if (doorCD <= 0 && scriptDepth === 0) run(() => touchDoor(door)); return; }
  if (wall) return;
  for (const o of m.objs) if (o.solid && vis(o) && r > o.x * T + 2 && l < (o.x + o.w) * T - 2 && b > o.y * T + 4 && t < (o.y + o.h) * T) return;
  S.x = nx; S.y = ny;
}
function findObj() {
  const dx = { left: -1, right: 1, up: 0, down: 0 }[S.dir], dy = { up: -1, down: 1, left: 0, right: 0 }[S.dir];
  const px = S.x + dx * 20, py = S.y - 6 + dy * 22, m = MAPS[S.map];
  const inside = o => px >= o.x * T - 4 && px < (o.x + o.w) * T + 4 && py >= o.y * T - 4 && py < (o.y + o.h) * T + 4;
  for (let pass = 0; pass < 2; pass++) for (let i = m.objs.length - 1; i >= 0; i--) {
    const o = m.objs[i]; if (!vis(o) || !(o.use || o.txt || o.hidespot)) continue;
    if ((pass === 0) !== (o.t === 'page')) continue;
    if (inside(o)) return o;
  }
  return null;
}
async function interact(o) {
  if (o.hidespot) {
    if (M.chase && M.chase.final) { await say('숨을 시간이 없다! 현관으로 도망쳐야 해!'); return; }
    const c = M.chase ? 0 : await choose(o.t === 'curtain' ? '커튼 뒤에 숨을까?' : '안에 숨을까?', ['숨는다', '그만둔다']);
    if (c === 0) {
      S.hidden = o; SFX.door();
      if (M.active && Math.hypot(S.x - M.x, S.y - M.y) < T * 3.5) M.grab = 1.6; // 잭이 너무 가까우면 숨는 걸 들킨다
    }
    return;
  }
  if (o.use) return o.use(o);
  if (o.txt) return say(...[].concat(o.txt));
}
